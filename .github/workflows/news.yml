name: Sync news

on:
  schedule:
    # Every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    name: Fetch news feeds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install rexml
        run: gem install rexml --no-document

      - name: Fetch feeds
        run: ruby scripts/fetch_news.rb

      - name: Commit updated news data
        run: |
          if git diff --quiet -- _data/news.yml; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/news.yml
          git commit -m "chore: sync news feed [skip ci]"
          git push
