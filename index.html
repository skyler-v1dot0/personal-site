---
layout: default
---
<section class="home-terminal">
  <p class="prompt-line">
    <span class="prompt-symbol">$</span>
    <span class="prompt-cmd">whoami</span>
  </p>
  <p class="terminal-output">{% if site.author.name != "" %}{{ site.author.name }}{% else %}skyler-v1dot0{% endif %}</p>

  <p class="prompt-line">
    <span class="prompt-symbol">$</span>
    <span class="prompt-cmd">cat about.txt</span>
  </p>
  <p class="terminal-output typewriter" style="--chars: {{ site.description | size }};">{{ site.description }}</p>

  <p class="prompt-line prompt-cursor">
    <span class="prompt-symbol">$</span>
    <span class="cursor"></span>
  </p>
</section>
