---
layout: page
title: news
permalink: /news/
description: "Security and tech news sites I check regularly."
---

<div class="news-grid">
  {% for site in site.data.news_sites %}
    <a class="news-card" href="{{ site.url }}" target="_blank" rel="noopener">
      <span class="news-card-name">{{ site.name }}</span>
      <p class="news-card-description">{{ site.description }}</p>
    </a>
  {% endfor %}
</div>
